substitutions:
  _BUCKET_NAME: ""
  _URL_MAP: ""

steps:
  - id: validate
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -c
      - |
        test -n "${_BUCKET_NAME}"
        test -n "${_URL_MAP}"

  - id: install
    name: node:22
    dir: frontend
    entrypoint: bash
    args:
      - -c
      - |
        corepack enable
        corepack prepare pnpm@11.1.1 --activate
        pnpm install --frozen-lockfile

  # - id: lint
  #   name: node:22
  #   dir: frontend
  #   entrypoint: bash
  #   args:
  #     - -c
  #     - |
  #       corepack enable
  #       corepack prepare pnpm@11.1.1 --activate
  #       pnpm lint

  - id: build
    name: node:22
    dir: frontend
    entrypoint: bash
    args:
      - -c
      - |
        corepack enable
        corepack prepare pnpm@11.1.1 --activate
        pnpm build

  - id: verify-build
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -c
      - |
        test -d frontend/dist

  - id: upload
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -c
      - |
        gsutil -m rsync -r -d \
          frontend/dist \
          gs://${_BUCKET_NAME}

  - id: invalidate-cdn
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud compute url-maps invalidate-cdn-cache \
          ${_URL_MAP} \
          --path "/*"

options:
  logging: CLOUD_LOGGING_ONLY
