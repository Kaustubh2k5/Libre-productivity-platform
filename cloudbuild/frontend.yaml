substitutions:
  _BUCKET_NAME: ""
  _URL_MAP: ""

steps:
  - id: validate-substitutions
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -c
      - |
        if [ -z "${_BUCKET_NAME}" ] || [ -z "${_URL_MAP}" ]; then
          echo "Missing required substitutions: _BUCKET_NAME and _URL_MAP"
          exit 1
        fi

  - id: setup-pnpm
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        corepack enable
        corepack prepare pnpm@11.1.1 --activate

  - id: install-dependencies
    name: node:22
    dir: frontend
    entrypoint: bash
    args:
      - -c
      - |
        corepack enable
        corepack prepare pnpm@11.1.1 --activate
        pnpm install --frozen-lockfile

  - id: lint
    name: node:22
    dir: frontend
    entrypoint: bash
    args:
      - -c
      - |
        corepack enable
        corepack prepare pnpm@11.1.1 --activate
        pnpm lint

  - id: build
    name: node:22
    dir: frontend
    entrypoint: bash
    args:
      - -c
      - |
        corepack enable
        corepack prepare pnpm@11.1.1 --activate
        pnpm build

  - id: upload
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud storage rsync \
          frontend/dist \
          "gs://${_BUCKET_NAME}" \
          --recursive \
          --delete

  - id: invalidate-cdn
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud compute url-maps invalidate-cdn-cache \
          "${_URL_MAP}" \
          --path "/*"

options:
  logging: CLOUD_LOGGING_ONLY
