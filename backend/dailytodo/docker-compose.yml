services:
  postgres:
    image: postgres:16-alpine
    container_name: dailytodo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dailytodo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dailytodo"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.1
    container_name: dailytodo-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: dailytodo-kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    container_name: dailytodo-migrate
    restart: "no"
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  dailytodo-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: dailytodo-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    ports:
      - "5003:5003"
    environment:
      PORT: ${PORT:-5003}
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      KAFKA_BROKER: ${KAFKA_BROKER}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}

  dailytodo-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: dailytodo-worker
    restart: unless-stopped
    command:
      - node
      - dist/workers/index.js
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    environment:
      PORT: ${PORT:-5003}
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      KAFKA_BROKER: ${KAFKA_BROKER}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}

volumes:
  postgres_data: